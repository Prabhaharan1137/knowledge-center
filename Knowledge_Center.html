<!-- Google Material Loading Spinner Container -->
<div id="loader-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 250px; font-family: 'Roboto', 'Google Sans', sans-serif; color: #5f6368;">
  <div class="spinner"></div>
  <p style="margin-top: 1rem; font-size: 0.95rem; font-weight: 500;">Fetching live Knowledge Center from GitHub...</p>
</div>

<style>
  .spinner {
    width: 38px;
    height: 38px;
    border: 3.5px solid #e8f0fe;
    border-top: 3.5px solid #1a73e8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>

<script>
  (async function loadRawGitHubApp() {
    // Direct raw GitHub URL with cache-busting timestamp to pull latest changes on every refresh
    const rawUrl = "https://raw.githubusercontent.com/Prabhaharan1137/knowledge-center/refs/heads/main/Knowledge_Center.html?cb=" + Date.now();
    const maxRetries = 3;
    let attempt = 0;

    while (attempt < maxRetries) {
      try {
        const response = await fetch(rawUrl, {
          cache: "no-store",
          headers: {
            "Pragma": "no-cache",
            "Cache-Control": "no-cache, no-store, must-revalidate"
          }
        });

        if (!response.ok) {
          throw new Error("HTTP Status " + response.status);
        }

        const liveHtml = await response.text();

        // Write live HTML directly into the Google Sites embed frame
        document.open();
        document.write(liveHtml);
        document.close();
        return;

      } catch (err) {
        attempt++;
        console.warn(`Attempt ${attempt} failed:`, err);
        if (attempt < maxRetries) {
          await new Promise(res => setTimeout(res, 800)); // Retry after 800ms
        } else {
          document.getElementById("loader-container").innerHTML = `
            <div style="text-align: center; color: #d93025; padding: 1.5rem; border: 1px solid #fce8e6; background-color: #fce8e6; border-radius: 8px;">
              <p style="font-weight: 700; margin-bottom: 0.25rem;">Unable to load Knowledge Center from GitHub</p>
              <p style="font-size: 0.85rem; color: #5f6368;">Please verify that the GitHub repository is public.</p>
            </div>
          `;
        }
      }
    }
  })();
</script>
