<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <style>
    :root {
      --google-blue: #1a73e8;
      --google-blue-hover: #1557b0;
      --google-blue-light: #e8f0fe;
      --google-green: #1e8e3e;
      --google-green-light: #e6f4ea;
      --google-yellow: #f9ab00;
      --google-yellow-light: #fef7e0;
      --google-red: #d93025;
      --google-red-light: #fce8e6;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --bg-body: #f8f9fa;
      --bg-card: #ffffff;
      --border-color: #dadce0;
      --shadow-sm: 0 1px 3px rgba(60,64,67,0.12), 0 1px 2px rgba(60,64,67,0.24);
      --shadow-md: 0 4px 6px rgba(60,64,67,0.15), 0 1px 3px rgba(60,64,67,0.2);
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Layout & Fit - Remove extra empty space */
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-body);
      color: var(--text-primary);
      font-family: 'Roboto', sans-serif;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Utility Bar */
    .top-utility-bar {
      background-color: #202124;
      color: #ffffff;
      padding: 0.4rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 200;
      flex-shrink: 0;
    }
    .top-utility-nav {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      width: 100%;
      flex-wrap: wrap;
    }
    .top-utility-link, .top-utility-btn {
      color: #ffffff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      font-size: 0.82rem;
      transition: transform 0.1s ease, background 0.2s ease;
      touch-action: manipulation;
    }
    .top-utility-link:hover, .top-utility-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .top-utility-link:active, .top-utility-btn:active {
      transform: scale(0.96);
    }
    .top-utility-btn.accent-add {
      background: var(--google-blue);
      border-color: var(--google-blue);
      margin-left: auto;
    }
    .top-utility-btn.accent-add:hover { background: var(--google-blue-hover); }

    /* Compact Header */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 36px;
      z-index: 100;
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 1.5rem; }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Google Sans', sans-serif;
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text-primary);
    }
    .brand-icon { color: var(--google-blue); font-size: 24px; }
    .nav-tabs { display: flex; gap: 0.25rem; height: 100%; }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 0 0.85rem;
      font-family: 'Google Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      height: 100%;
      transition: color 0.2s, border-bottom-color 0.2s, transform 0.1s;
      touch-action: manipulation;
    }
    .tab-btn:hover { color: var(--google-blue); }
    .tab-btn:active { transform: scale(0.97); }
    .tab-btn.active { color: var(--google-blue); border-bottom-color: var(--google-blue); }

    /* Container Flex Fit */
    .container {
      width: 100%;
      flex: 1 0 auto;
      padding: 1rem 1.25rem;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Summary Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.85rem;
      margin-bottom: 0.85rem;
    }
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .kpi-icon-wrapper {
      width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .kpi-info .value { font-family: 'Google Sans', sans-serif; font-size: 1.3rem; font-weight: 700; line-height: 1.1; }
    .kpi-info .label { font-size: 0.78rem; color: var(--text-secondary); }

    /* Filter Box */
    .filter-card-highlight {
      background: #ffffff;
      border: 1.5px solid var(--google-blue);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      margin-bottom: 0.85rem;
    }
    .filter-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.35rem;
    }
    .filter-label-catchy {
      font-family: 'Google Sans', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--google-blue-hover);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .styled-dropdown-catchy {
      width: 100%;
      padding: 0.5rem 0.85rem;
      font-family: 'Google Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--google-blue-hover);
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }
    .styled-dropdown-catchy:focus { border-color: var(--google-blue); }

    .toolbar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.5rem 0.85rem;
      margin-bottom: 0.85rem;
    }
    .search-box { position: relative; width: 100%; }
    .search-box .material-icons-outlined { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 20px; }
    .search-input { width: 100%; padding: 0.45rem 1rem 0.45rem 2.2rem; border: 1px solid var(--border-color); border-radius: 20px; background: var(--bg-body); font-size: 0.88rem; outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--google-blue); background: #ffffff; }

    /* Cards Grid */
    .resources-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.85rem; }
    .resource-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 0.9rem;
      display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.15s ease, box-shadow 0.15s ease;
      touch-action: manipulation;
    }
    .resource-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-sm); }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.5rem; }
    .card-title { font-family: 'Google Sans', sans-serif; font-size: 0.92rem; font-weight: 500; line-height: 1.35; }
    .category-badge { font-size: 0.7rem; font-weight: 500; padding: 0.2rem 0.5rem; border-radius: 10px; white-space: nowrap; }
    .card-actions { margin-top: 0.75rem; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #f1f3f4; padding-top: 0.4rem; }
    .link-btn { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--google-blue); text-decoration: none; font-weight: 500; font-size: 0.82rem; padding: 0.3rem 0.6rem; border-radius: 4px; transition: background 0.15s, transform 0.1s; touch-action: manipulation; }
    .link-btn:hover { background: var(--google-blue-light); }
    .link-btn:active { transform: scale(0.95); }
    .action-icons { display: flex; gap: 0.1rem; align-items: center; }
    .action-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 0.3rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; transition: background 0.15s, transform 0.1s; touch-action: manipulation; }
    .action-btn:hover { background: var(--bg-body); }
    .action-btn:active { transform: scale(0.9); }
    .bookmark-btn.bookmarked { color: var(--google-yellow); }

    /* Tables */
    .table-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); overflow-x: auto; }
    .doc-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    .doc-table th { background: var(--bg-body); font-family: 'Google Sans', sans-serif; font-weight: 500; color: var(--text-secondary); padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
    .doc-table td { padding: 0.65rem 0.85rem; border-bottom: 1px solid #f1f3f4; }
    .doc-table tr:hover { background-color: #f8f9fa; }
    .doc-type-tag { padding: 0.15rem 0.45rem; border-radius: 4px; font-size: 0.72rem; font-weight: 500; background: #e8eaed; color: var(--text-primary); }

    /* Animated Modal Dialog */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(32, 33, 36, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: var(--bg-card); 
      border-radius: var(--radius); 
      width: 100%; 
      max-width: 480px; 
      padding: 1.25rem; 
      box-shadow: var(--shadow-md);
      transform: scale(0.92);
      transition: transform 0.2s ease;
    }
    .modal-overlay.open .modal-content {
      transform: scale(1);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; }
    .modal-header h2 { font-family: 'Google Sans', sans-serif; font-size: 1.1rem; font-weight: 500; }
    .modal-close-btn { background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 0.2rem; border-radius: 50%; transition: background 0.15s; }
    .modal-close-btn:hover { background: var(--bg-body); }
    .modal-form { display: flex; flex-direction: column; gap: 0.75rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.25rem; }
    .form-group label { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); }
    .form-group input, .form-group select { padding: 0.5rem 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.88rem; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--google-blue); }
    .btn-submit { background: var(--google-blue); color: white; border: none; padding: 0.6rem; border-radius: 6px; font-family: 'Google Sans', sans-serif; font-weight: 500; cursor: pointer; transition: background 0.2s, transform 0.1s; touch-action: manipulation; }
    .btn-submit:hover { background: var(--google-blue-hover); }
    .btn-submit:active { transform: scale(0.97); }

    .empty-state { grid-column: 1 / -1; text-align: center; padding: 2rem 1rem; color: var(--text-secondary); }
  </style>
</head>

    function switchTab(tabId, el) {
      activeTab = tabId;

    function persistStateLocally() {
      localStorage.setItem('kc_learning_dataset_v13', JSON.stringify(dataset));
      localStorage.setItem('kc_doc_dataset_v13', JSON.stringify(docDataset));
    }

    async function commitDatasetToGitHub(updatedLearningDataset, updatedDocDataset, commitMessage) {
      persistStateLocally();
      const { owner, repo, fileTarget, token } = GITHUB_CONFIG;
      const apiBase = `https://api.github.com/repos/${owner}/${repo}`;
      const headers = {
        "Authorization": `token ${token}`,
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      };

      try {
        const fileRes = await fetch(`${apiBase}/contents/${fileTarget}?ref=main`, { headers });
        if (!fileRes.ok) throw new Error("Could not fetch repo target file directly.");
        const fileData = await fileRes.json();
        
        let currentContent = decodeURIComponent(escape(atob(fileData.content.replace(/\s/g, ''))));

        if (updatedLearningDataset) {
          const learningDataStr = JSON.stringify(updatedLearningDataset, null, 6);
          currentContent = currentContent.replace(
            /\/\* LEARNING_DATA_START \*\/[\s\S]*?\/\* LEARNING_DATA_END \*\//,
            `/* LEARNING_DATA_START */\n    let dataset = ${learningDataStr};\n/* LEARNING_DATA_END */`
          );
        }

        if (updatedDocDataset) {
          const docDataStr = JSON.stringify(updatedDocDataset, null, 6);
          currentContent = currentContent.replace(
            /\/\* DOC_DATA_START \*\/[\s\S]*?\/\* DOC_DATA_END \*\//,
            `/* DOC_DATA_START */\n    let docDataset = ${docDataStr};\n/* DOC_DATA_END */`
          );
        }

        const updateRes = await fetch(`${apiBase}/contents/${fileTarget}`, {
          method: "PUT",
          headers,
          body: JSON.stringify({
            message: commitMessage,
            content: btoa(unescape(encodeURIComponent(currentContent))),
            sha: fileData.sha,
            branch: "main"
          })
        });

        if (!updateRes.ok) {
          const errData = await updateRes.json();
          throw new Error(errData.message || "Commit failed");
        }
      } catch (err) {
        console.warn("GitHub commit notice:", err.message, "- Updates rendered and saved locally.");
      }
    }

    async function handleAddSubmission(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.textContent = "Publishing Link...";
      submitBtn.disabled = true;

      const targetHub = document.getElementById('targetHub').value;
      const link = document.getElementById('newLink').value.trim();

      try {
        if (targetHub === 'learning') {
          const title = document.getElementById('newTitle').value.trim();
          const category = document.getElementById('newModule').value;
          const newItem = { id: `res_custom_${Date.now()}`, name: title, category, link };
          dataset.unshift(newItem);
          await commitDatasetToGitHub(dataset, null, `Add Learning Link: ${title}`);
        } else {
          const pkg = document.getElementById('newPkg').value.trim();
          const ver = document.getElementById('newVer').value.trim();
          const type = document.getElementById('newDocType').value.trim();
          const newItem = { pkg, ver, type, link };
          docDataset.unshift(newItem);
          await commitDatasetToGitHub(null, docDataset, `Add Doc Link: ${pkg}`);
        }

        // Close Modal & Reset Form Immediately
        closeAddModal();
        document.getElementById('addResourceForm').reset();

        syncDropdownOptions();
        syncDocPackageOptions();
        renderLearningHub();
        renderDocumentHub();

        alert("Success! Link submitted and visible immediately.");
      } catch (err) {
        alert(`Error: ${err.message}`);
      } finally {
        submitBtn.textContent = "Publish Link Live to GitHub";
        submitBtn.disabled = false;
      }
    }

    async function editLearningItem(id) {
      if (!verifyAdminPIN()) { alert("Incorrect Password."); return; }
      const item = dataset.find(d => d.id === id);
      if (!item) return;

      const newTitle = prompt("Edit Title:", item.name);
      if (!newTitle) return;
      const newLink = prompt("Edit URL:", item.link);
      if (!newLink) return;

      item.name = newTitle.trim();
      item.link = newLink.trim();

      await commitDatasetToGitHub(dataset, null, `Admin Edit: ${item.name}`);
      renderLearningHub();
    }

    async function deleteLearningItem(id) {
      if (!verifyAdminPIN()) { alert("Incorrect Password."); return; }
      const item = dataset.find(d => d.id === id);
      if (!item) return;
      if (!confirm(`Are you sure you want to delete "${item.name}"?`)) return;

      dataset = dataset.filter(d => d.id !== id);

      await commitDatasetToGitHub(dataset, null, `Admin Delete: ${item.name}`);
      syncDropdownOptions();
      renderLearningHub();
    }

    async function editDocItem(index) {
      if (!verifyAdminPIN()) { alert("Incorrect Password."); return; }
      const item = docDataset[index];
      if (!item) return;

      const newPkg = prompt("Edit Package Name:", item.pkg);
      if (!newPkg) return;
      const newVer = prompt("Edit Version:", item.ver);
      if (!newVer) return;
      const newType = prompt("Edit Doc Type:", item.type);
      if (!newType) return;
      const newLink = prompt("Edit Link:", item.link);
      if (!newLink) return;

      item.pkg = newPkg.trim();
      item.ver = newVer.trim();
      item.type = newType.trim();
      item.link = newLink.trim();

      await commitDatasetToGitHub(null, docDataset, `Admin Edit Doc: ${item.pkg}`);
      renderDocumentHub();
    }

    async function deleteDocItem(index) {
      if (!verifyAdminPIN()) { alert("Incorrect Password."); return; }
      const item = docDataset[index];
      if (!item) return;
      if (!confirm(`Delete "${item.pkg} (${item.type})"?`)) return;

      docDataset.splice(index, 1);

      await commitDatasetToGitHub(null, docDataset, `Admin Delete Doc: ${item.pkg}`);
      syncDocPackageOptions();
      renderDocumentHub();
    }

      if (bookmarkedIds.has(id)) { bookmarkedIds.delete(id); } else { bookmarkedIds.add(id); }

      renderLearningHub();

    function getCategoryStyle(category) {
      const key = category.toLowerCase().trim();
      return categoryColors[key] || categoryColors['default'];
    }

    function renderLearningHub() {
      const grid = document.getElementById('resourcesGrid');
      const filtered = dataset.filter(res => {
        const matchesModule = selectedModule === 'ALL' || res.category === selectedModule;
        const matchesSearch = res.name.toLowerCase().includes(searchQuery) || res.category.toLowerCase().includes(searchQuery);
        return matchesModule && matchesSearch;
      });

      document.getElementById('kpiTotal').textContent = dataset.length;
      document.getElementById('kpiVisible').textContent = filtered.length;
      document.getElementById('kpiBookmarks').textContent = bookmarkedIds.size;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><span class="material-icons-outlined" style="font-size:36px; margin-bottom:0.5rem;">search_off</span><h3>No learning resources found</h3></div>`;
        return;
      }

      grid.innerHTML = filtered.map(res => {
        const style = getCategoryStyle(res.category);
        const isBookmarked = bookmarkedIds.has(res.id);

        return `
          <article class="resource-card">
            <div>
              <div class="card-header">
                <span class="category-badge" style="background:${style.bg}; color:${style.color}">${res.category}</span>
                <div class="action-icons">
                  <button class="action-btn bookmark-btn ${isBookmarked ? 'bookmarked' : ''}" onclick="toggleBookmark('${res.id}')" title="Bookmark">
                    <span class="material-icons-outlined">${isBookmarked ? 'star' : 'star_border'}</span>
                  </button>
                  <button class="action-btn" onclick="editLearningItem('${res.id}')" title="Edit (Password Protected)">
                    <span class="material-icons-outlined" style="color:var(--google-blue);">edit</span>
                  </button>
                  <button class="action-btn" onclick="deleteLearningItem('${res.id}')" title="Delete (Password Protected)">
                    <span class="material-icons-outlined" style="color:var(--google-red);">delete</span>
                  </button>
                </div>
              </div>
              <h3 class="card-title">${res.name}</h3>
            </div>
            <div class="card-actions">
              <a href="${res.link}" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span>Open Link</span><span class="material-icons-outlined" style="font-size:15px;">open_in_new</span>
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderDocumentHub() {
      const tbody = document.getElementById('docTableBody');
      const filteredWithIndex = docDataset.map((doc, idx) => ({ ...doc, originalIndex: idx })).filter(doc => {
        const matchesPkg = selectedDocPackage === 'ALL' || doc.pkg === selectedDocPackage;
        const matchesSearch = doc.pkg.toLowerCase().includes(docSearchQuery) ||
                            doc.ver.toLowerCase().includes(docSearchQuery) ||
                            doc.type.toLowerCase().includes(docSearchQuery);
        return matchesPkg && matchesSearch;
      });

      if (filteredWithIndex.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 1.5rem;">No matching documents found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filteredWithIndex.map(doc => `
        <tr>
          <td><strong>${doc.pkg}</strong></td>
          <td>${doc.ver}</td>
          <td><span class="doc-type-tag">${doc.type}</span></td>
          <td>
            <div style="display: flex; align-items: center; gap: 0.4rem;">

              </a>

                <span class="material-icons-outlined" style="color:var(--google-red);">delete</span>
              </button>
            </div>

        </tr>
